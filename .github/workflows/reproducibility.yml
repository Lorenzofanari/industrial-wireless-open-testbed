name: reproducibility

# Hardware-free CI: installs Python, runs tests, runs the synthetic demo on a
# lightweight config, and verifies reproducibility. No radio hardware required.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint (non-blocking)
        run: ruff check src tests scripts
        continue-on-error: true

      - name: Run tests
        run: pytest -q

      - name: Synthetic demo (lightweight config)
        run: |
          python scripts/run_demo.py --config configs/lora_sdr_like.yaml --out results/demo/lora_sdr_like

      - name: Verify reproducibility
        run: python scripts/verify_reproducibility.py --all
