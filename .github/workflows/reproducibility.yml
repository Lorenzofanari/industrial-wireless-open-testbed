name: reproducibility

# Hardware-free CI: installs Python, runs the full test suite (including the
# independent analytical regression tests in tests/test_metrics_independent.py),
# runs the synthetic demo for all four W1-W4 profiles, and verifies trace
# reproducibility against the committed references. No radio hardware required.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Lint (non-blocking)
        run: ruff check src tests scripts
        continue-on-error: true

      - name: Report package version
        run: python -c "import sys; sys.path.insert(0, 'src'); import packet_observability as p; print('packet_observability', p.__version__)"

      # Executes every test under tests/, including the independent
      # analytically-derived regression tests (TEST A/B/C and boundary cases).
      - name: Run tests
        run: python -m pytest -v

      - name: Synthetic demo (all W1-W4 profiles)
        run: python scripts/run_demo.py --all

      - name: Verify reproducibility
        run: python scripts/verify_reproducibility.py --all
